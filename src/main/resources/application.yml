spring:
  datasource:
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: com.trae.loganalysis.config.SQLiteDialect
    open-in-view: false
    properties:
      hibernate:
        dialect: com.trae.loganalysis.config.SQLiteDialect
        jdbc:
          use_get_generated_keys: false
        pagination:
          limit_handler: org.hibernate.dialect.pagination.LimitOffsetLimitHandler
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# 激活的配置文件
spring.profiles.active: dev

# 上传文件存储目录
upload:
  directory: ./uploads